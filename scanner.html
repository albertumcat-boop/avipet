<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVIPET — Escáner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    video { border-radius: 12px; width: 100%; display: block; }
    #videoWrap { position: relative; background: #0f172a; border-radius: 16px; overflow: hidden; }
    #scanLine {
      position: absolute; left: 10%; right: 10%;
      height: 2px; background: #ef4444;
      top: 50%; transform: translateY(-50%);
      box-shadow: 0 0 6px #ef4444;
    }
    #scanBox {
      position: absolute; left: 10%; right: 10%;
      top: 30%; bottom: 30%;
      border: 2px solid rgba(239,68,68,0.5);
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-start pt-6 px-4">

  <div class="w-full max-w-sm">
    <!-- Cabecera -->
    <div class="flex items-center justify-center mb-4">
      <span class="text-2xl mr-2">🐾</span>
      <h1 class="text-white font-black text-lg tracking-tight">AVIPET Escáner</h1>
    </div>

    <!-- Estado de sesión -->
    <div id="estadoSesion" class="bg-blue-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold">
      Conectando...
    </div>

    <!-- Cámara con línea de escaneo -->
    <div id="videoWrap" class="mb-4" style="min-height:220px;">
      <video id="video" autoplay playsinline muted></video>
      <div id="scanBox"></div>
      <div id="scanLine"></div>
    </div>

    <!-- Estado del último scan -->
    <div id="estadoScan" class="bg-slate-800 rounded-xl px-4 py-3 mb-3 text-slate-300 text-center text-[12px] min-h-[48px] flex items-center justify-center">
      Apunta al código de barras del producto
    </div>

    <!-- Entrada manual como respaldo -->
    <div class="bg-slate-800 rounded-xl px-4 py-3 mb-4">
      <p class="text-slate-400 text-[10px] font-bold uppercase mb-2">¿No detecta? Escribe el código:</p>
      <div class="flex gap-2">
        <input id="manualInput" type="text" inputmode="numeric" pattern="[0-9]*"
          placeholder="7593432000024"
          class="flex-1 bg-slate-700 text-white text-[12px] font-mono rounded-lg px-3 py-2 outline-none border border-slate-600 focus:border-blue-500">
        <button onclick="enviarManual()"
          class="bg-blue-600 text-white font-black text-[11px] px-3 py-2 rounded-lg">
          Enviar
        </button>
      </div>
    </div>

    <!-- Lista de códigos enviados -->
    <div id="listaEscaneados" class="space-y-2 mb-4"></div>

    <!-- Botón finalizar -->
    <button id="btnFinalizar"
      class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl text-[13px] transition-colors hidden"
      onclick="finalizarSesion()">
      ✅ Finalizar — cerrar escáner
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore, doc, onSnapshot, updateDoc, arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBd7HDH1wDbkq8T1XTsKUV0gBQ_O_BF7jI",
      authDomain:        "avicolapet.firebaseapp.com",
      projectId:         "avicolapet",
      storageBucket:     "avicolapet.firebasestorage.app",
      messagingSenderId: "909478828234",
      appId:             "1:909478828234:web:b04a444b41d239cc4a3c33"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const params    = new URLSearchParams(location.search);
    const sessionId = params.get('s');

    const estadoSesionEl = document.getElementById('estadoSesion');
    const estadoScanEl   = document.getElementById('estadoScan');
    const listaEl        = document.getElementById('listaEscaneados');
    const btnFinalizar   = document.getElementById('btnFinalizar');
    const video          = document.getElementById('video');

    if (!sessionId) {
      estadoSesionEl.textContent = '❌ Sin sesión válida. Escanea el QR desde AVIPET.';
      estadoSesionEl.className = 'bg-red-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
      throw new Error('No sessionId');
    }

    const sesRef   = doc(db, 'scanner_sessions', sessionId);
    let scanCount  = 0;
    let lastCode   = '';
    let lastTs     = 0;
    let stream     = null;
    let detectLoop = null;

    // Escuchar si la sesión se cierra desde el PC
    onSnapshot(sesRef, snap => {
      if (!snap.exists() || snap.data().activa === false) {
        estadoSesionEl.textContent = '🔒 Sesión cerrada desde el PC';
        estadoSesionEl.className = 'bg-slate-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
        if (detectLoop) { cancelAnimationFrame(detectLoop); detectLoop = null; }
        if (stream) stream.getTracks().forEach(t => t.stop());
      }
    });

    estadoSesionEl.textContent = '🟢 Sesión activa — listo para escanear';
    estadoSesionEl.className = 'bg-green-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';

    // ── Enviar código a Firestore ──────────────────────────
    async function enviarCodigo(code) {
      const now = Date.now();
      if (code === lastCode && now - lastTs < 2500) return;
      lastCode = code;
      lastTs   = now;
      scanCount++;

      estadoScanEl.textContent = `⏳ Enviando: ${code}`;
      estadoScanEl.style.color = '#fbbf24';

      try {
        await updateDoc(sesRef, {
          scans: arrayUnion({ codigo: code, ts: Date.now(), n: scanCount })
        });
        estadoScanEl.textContent = `✅ Enviado: ${code}`;
        estadoScanEl.style.color = '#4ade80';

        const item = document.createElement('div');
        item.className = 'bg-slate-700 rounded-xl px-3 py-2 flex items-center gap-2';
        item.innerHTML = `<span class="text-green-400 font-black">✓</span>
          <span class="text-white text-[11px] font-mono flex-1 truncate">${code}</span>
          <span class="text-slate-400 text-[10px]">#${scanCount}</span>`;
        listaEl.prepend(item);
        btnFinalizar.classList.remove('hidden');
      } catch(e) {
        estadoScanEl.textContent = '❌ Error: ' + e.message;
        estadoScanEl.style.color = '#f87171';
      }
    }

    window.enviarManual = () => {
      const val = document.getElementById('manualInput').value.trim();
      if (!val) return;
      document.getElementById('manualInput').value = '';
      enviarCodigo(val);
    };
    document.getElementById('manualInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.enviarManual();
    });

    // ── Intentar BarcodeDetector (API nativa de Chrome/Android) ──
    async function iniciarBarcodeDetector() {
      const detector = new BarcodeDetector({
        formats: ['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code','data_matrix']
      });

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();

      estadoScanEl.textContent = 'Apunta al código de barras del producto';

      const tick = async () => {
        if (video.readyState >= 2) {
          try {
            const barcodes = await detector.detect(video);
            if (barcodes.length > 0) {
              await enviarCodigo(barcodes[0].rawValue);
            }
          } catch(_) {}
        }
        detectLoop = requestAnimationFrame(tick);
      };
      detectLoop = requestAnimationFrame(tick);
      return true;
    }

    // ── Fallback: Html5Qrcode ──────────────────────────────
    async function iniciarHtml5Qrcode() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => {
          try {
            const formats = [0,2,3,4,5,8,9,10,11,14,15]; // todos los formatos numéricos
            const scanner = new Html5Qrcode('videoWrap', { formatsToSupport: formats });
            Html5Qrcode.getCameras().then(cameras => {
              if (!cameras || !cameras.length) { reject(new Error('Sin cámara')); return; }
              const cam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
              scanner.start(
                cam.id,
                { fps: 15, qrbox: { width: 250, height: 100 } },
                (code) => enviarCodigo(code),
                () => {}
              ).then(() => {
                window._scannerH5 = scanner;
                resolve(true);
              }).catch(reject);
            }).catch(reject);
          } catch(e) { reject(e); }
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    // ── Arrancar: BarcodeDetector primero, Html5Qrcode si falla ──
    (async () => {
      try {
        if ('BarcodeDetector' in window) {
          estadoScanEl.textContent = '📷 Iniciando cámara (modo nativo)...';
          await iniciarBarcodeDetector();
        } else {
          throw new Error('BarcodeDetector no disponible');
        }
      } catch(e1) {
        estadoScanEl.textContent = '📷 Iniciando cámara (modo compatibilidad)...';
        try {
          await iniciarHtml5Qrcode();
          estadoScanEl.textContent = 'Apunta al código de barras del producto';
        } catch(e2) {
          estadoScanEl.textContent = '⚠️ No se pudo abrir la cámara. Usa la entrada manual abajo.';
        }
      }
    })();

    window.finalizarSesion = async () => {
      if (detectLoop) { cancelAnimationFrame(detectLoop); detectLoop = null; }
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (window._scannerH5) { try { await window._scannerH5.stop(); } catch(_) {} }
      estadoSesionEl.textContent = `✅ ${scanCount} código(s) enviado(s). Puedes cerrar esta página.`;
      estadoSesionEl.className = 'bg-green-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
      btnFinalizar.textContent  = '✅ Escaneo completado';
      btnFinalizar.disabled     = true;
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVIPET — Escáner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    #video { width:100%; border-radius:12px; display:block; background:#000; }
    #videoWrap { position:relative; background:#0f172a; border-radius:16px; overflow:hidden; }
    #aimLine {
      position:absolute; left:8%; right:8%; height:2px;
      top:50%; transform:translateY(-50%);
      background:#ef4444; box-shadow:0 0 8px #ef4444;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-start pt-4 px-4 pb-8">

  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center mb-3">
      <span class="text-2xl mr-2">🐾</span>
      <h1 class="text-white font-black text-lg tracking-tight">AVIPET Escáner</h1>
    </div>

    <div id="estadoSesion" class="bg-blue-600 rounded-xl px-4 py-2 mb-3 text-white text-center text-[12px] font-bold">
      Conectando...
    </div>

    <!-- Video -->
    <div id="videoWrap" class="mb-3" style="min-height:200px;">
      <video id="video" autoplay playsinline muted></video>
      <div id="aimLine"></div>
    </div>

    <!-- Estado del scan -->
    <div id="estadoScan" class="bg-slate-800 rounded-xl px-4 py-3 mb-3 text-slate-300 text-center text-[12px] min-h-[44px] flex items-center justify-center">
      Iniciando cámara...
    </div>

    <!-- Productos escaneados -->
    <div id="listaEscaneados" class="space-y-2 mb-3"></div>

    <!-- Entrada manual -->
    <div class="bg-slate-800 rounded-xl px-4 py-3 mb-3">
      <p class="text-slate-400 text-[10px] font-bold uppercase mb-2">¿No detecta? Escribe el código:</p>
      <div class="flex gap-2">
        <input id="manualInput" type="text" inputmode="numeric"
          placeholder="7593420000024"
          class="flex-1 bg-slate-700 text-white text-[12px] font-mono rounded-lg px-3 py-2 outline-none border border-slate-600 focus:border-blue-400">
        <button id="btnManual"
          class="bg-blue-600 text-white font-black text-[11px] px-4 py-2 rounded-lg active:bg-blue-700">
          Enviar
        </button>
      </div>
    </div>

    <button id="btnFinalizar"
      class="w-full bg-green-500 text-white font-black py-3 rounded-xl text-[13px] hidden">
      ✅ Finalizar
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore, doc, onSnapshot, updateDoc, arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBd7HDH1wDbkq8T1XTsKUV0gBQ_O_BF7jI",
      authDomain:        "avicolapet.firebaseapp.com",
      projectId:         "avicolapet",
      storageBucket:     "avicolapet.firebasestorage.app",
      messagingSenderId: "909478828234",
      appId:             "1:909478828234:web:b04a444b41d239cc4a3c33"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const params    = new URLSearchParams(location.search);
    const sessionId = params.get('s');

    const sesionEl   = document.getElementById('estadoSesion');
    const scanEl     = document.getElementById('estadoScan');
    const listaEl    = document.getElementById('listaEscaneados');
    const btnFin     = document.getElementById('btnFinalizar');
    const manualInp  = document.getElementById('manualInput');
    const btnManual  = document.getElementById('btnManual');

    if (!sessionId) {
      sesionEl.textContent = '❌ URL inválida — escanea el QR desde AVIPET';
      sesionEl.className = sesionEl.className.replace('bg-blue-600','bg-red-600');
      throw new Error('no sessionId');
    }

    const sesRef   = doc(db, 'scanner_sessions', sessionId);
    let scanCount  = 0;
    let lastCode   = '';
    let lastTs     = 0;
    let codeReader = null;

    // Monitorear si la sesión sigue activa
    onSnapshot(sesRef, snap => {
      if (!snap.exists() || snap.data().activa === false) {
        sesionEl.textContent = '🔒 Sesión cerrada desde el PC';
        sesionEl.className = sesionEl.className.replace(/bg-\w+-600/,'bg-slate-600');
      }
    });

    sesionEl.textContent = '🟢 Sesión activa — listo para escanear';
    sesionEl.className = sesionEl.className.replace('bg-blue-600','bg-green-600');

    // ── Enviar código a Firestore ──────────────────────────
    async function enviarCodigo(code) {
      code = String(code).trim();
      if (!code) return;
      const now = Date.now();
      if (code === lastCode && now - lastTs < 2000) return;
      lastCode = code;
      lastTs   = now;
      scanCount++;

      scanEl.textContent = `⏳ Enviando: ${code}`;
      scanEl.style.color = '#fbbf24';

      try {
        await updateDoc(sesRef, {
          scans: arrayUnion({ codigo: code, ts: Date.now(), n: scanCount })
        });
        scanEl.textContent = `✅ Enviado: ${code}`;
        scanEl.style.color = '#4ade80';

        const item = document.createElement('div');
        item.className = 'bg-slate-700 rounded-xl px-3 py-2 flex items-center gap-2';
        item.innerHTML = `<span class="text-green-400 font-black text-[13px]">✓</span>
          <span class="text-white text-[11px] font-mono flex-1">${code}</span>
          <span class="text-slate-400 text-[10px]">#${scanCount}</span>`;
        listaEl.prepend(item);
        btnFin.classList.remove('hidden');
      } catch(e) {
        scanEl.textContent = '❌ Error: ' + e.message;
        scanEl.style.color = '#f87171';
      }
    }

    // ── Manual input ──────────────────────────────────────
    btnManual.addEventListener('click', () => {
      const v = manualInp.value.trim();
      if (v) { enviarCodigo(v); manualInp.value = ''; }
    });
    manualInp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { btnManual.click(); }
    });

    // ── ZXing scanner ──────────────────────────────────────
    async function iniciarZXing() {
      if (typeof ZXing === 'undefined') throw new Error('ZXing no cargó');

      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.QR_CODE,
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      codeReader = new ZXing.BrowserMultiFormatReader(hints, 400);

      const devices = await codeReader.listVideoInputDevices();
      if (!devices || !devices.length) throw new Error('Sin cámara disponible');

      const cam = devices.find(d => /back|rear|environment/i.test(d.label))
               || devices[devices.length - 1];

      scanEl.textContent = 'Apunta al código de barras — línea roja al centro';
      scanEl.style.color = '';

      codeReader.decodeFromVideoDevice(cam.deviceId, 'video', (result, err) => {
        if (result) enviarCodigo(result.getText());
        // err es normal en frames sin código — no mostrar
      });
    }

    (async () => {
      try {
        await iniciarZXing();
      } catch(e) {
        scanEl.textContent = '⚠️ Cámara no disponible. Usa el campo manual abajo.';
        scanEl.style.color = '#f87171';
        console.error('ZXing error:', e);
      }
    })();

    btnFin.addEventListener('click', () => {
      if (codeReader) codeReader.reset();
      sesionEl.textContent = `✅ ${scanCount} código(s) enviado(s). Cierra esta página.`;
      btnFin.textContent   = '✅ Completado';
      btnFin.disabled      = true;
    });
  </script>
</body>
</html>

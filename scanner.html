<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVIPET — Escáner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #qr-reader video { border-radius: 12px; }
    #qr-reader { border: none !important; }
    #qr-reader__scan_region { border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-start pt-6 px-4">

  <div class="w-full max-w-sm">
    <!-- Cabecera -->
    <div class="flex items-center justify-center mb-4">
      <span class="text-2xl mr-2">🐾</span>
      <h1 class="text-white font-black text-lg tracking-tight">AVIPET Escáner</h1>
    </div>

    <!-- Estado de sesión -->
    <div id="estadoSesion" class="bg-blue-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold">
      Conectando...
    </div>

    <!-- Cámara -->
    <div class="bg-slate-800 rounded-2xl overflow-hidden mb-4">
      <div id="qr-reader" class="w-full"></div>
    </div>

    <!-- Estado del último scan -->
    <div id="estadoScan" class="bg-slate-800 rounded-xl px-4 py-3 mb-4 text-slate-300 text-center text-[12px] min-h-[48px] flex items-center justify-center">
      Centra el código de barras en la línea roja · mantén el teléfono horizontal
    </div>

    <!-- Lista de productos escaneados -->
    <div id="listaEscaneados" class="space-y-2 mb-4"></div>

    <!-- Botón finalizar -->
    <button id="btnFinalizar"
      class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl text-[13px] transition-colors hidden"
      onclick="finalizarSesion()">
      ✅ Finalizar — volver a facturación
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore, doc, onSnapshot, updateDoc, arrayUnion, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBd7HDH1wDbkq8T1XTsKUV0gBQ_O_BF7jI",
      authDomain:        "avicolapet.firebaseapp.com",
      projectId:         "avicolapet",
      storageBucket:     "avicolapet.firebasestorage.app",
      messagingSenderId: "909478828234",
      appId:             "1:909478828234:web:b04a444b41d239cc4a3c33"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // ── Leer sessionId de la URL ──────────────────────────
    const params    = new URLSearchParams(location.search);
    const sessionId = params.get('s');

    const estadoSesionEl  = document.getElementById('estadoSesion');
    const estadoScanEl    = document.getElementById('estadoScan');
    const listaEl         = document.getElementById('listaEscaneados');
    const btnFinalizar    = document.getElementById('btnFinalizar');

    if (!sessionId) {
      estadoSesionEl.textContent = '❌ Sin sesión válida. Escanea el QR desde facturación.';
      estadoSesionEl.className = 'bg-red-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
      throw new Error('No sessionId');
    }

    const sesRef = doc(db, 'scanner_sessions', sessionId);
    let scanCount = 0;
    let lastCode = '';
    let lastTs = 0;

    // Escuchar si la sesión sigue activa
    onSnapshot(sesRef, snap => {
      if (!snap.exists() || snap.data().activa === false) {
        estadoSesionEl.textContent = '🔒 Sesión cerrada desde facturación';
        estadoSesionEl.className = 'bg-slate-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
      }
    });

    estadoSesionEl.textContent = '🟢 Sesión activa — listo para escanear';
    estadoSesionEl.className = 'bg-green-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';

    // ── Iniciar cámara ────────────────────────────────────
    // Especificar formatos: QR + todos los códigos de barras 1D comunes
    const scanner = new Html5Qrcode('qr-reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
      ]
    });
    Html5Qrcode.getCameras().then(cameras => {
      if (!cameras || !cameras.length) {
        estadoScanEl.textContent = '⚠️ No se encontró cámara en este dispositivo.';
        return;
      }
      const cam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
      scanner.start(
        cam.id,
        { fps: 15, qrbox: { width: 280, height: 100 }, aspectRatio: 2.0 },
        async (code) => {
          const now = Date.now();
          if (code === lastCode && now - lastTs < 2500) return;
          lastCode = code;
          lastTs = now;
          scanCount++;

          estadoScanEl.textContent = `⏳ Buscando: ${code}`;

          try {
            await updateDoc(sesRef, {
              scans: arrayUnion({ codigo: code, ts: Date.now(), n: scanCount })
            });
            estadoScanEl.textContent = `✅ Código enviado al carrito`;

            // Agregar a la lista visual
            const item = document.createElement('div');
            item.className = 'bg-slate-700 rounded-xl px-3 py-2 flex items-center gap-2';
            item.innerHTML = `<span class="text-green-400 font-black">✓</span>
              <span class="text-white text-[11px] font-mono flex-1 truncate">${code}</span>
              <span class="text-slate-400 text-[10px]">#${scanCount}</span>`;
            listaEl.prepend(item);

            btnFinalizar.classList.remove('hidden');
          } catch(e) {
            estadoScanEl.textContent = '❌ Error al enviar: ' + e.message;
          }
        },
        () => {}
      );
    }).catch(e => {
      estadoScanEl.textContent = '⚠️ ' + e.message;
    });

    window.finalizarSesion = async () => {
      try { await scanner.stop(); } catch(_) {}
      estadoSesionEl.textContent = `✅ ${scanCount} producto(s) enviado(s). Puedes cerrar esta página.`;
      estadoSesionEl.className = 'bg-green-600 rounded-xl px-4 py-2 mb-4 text-white text-center text-[12px] font-bold';
      btnFinalizar.textContent = '✅ Escaneo completado';
      btnFinalizar.disabled = true;
    };
  </script>
</body>
</html>

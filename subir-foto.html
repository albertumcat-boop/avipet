<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subir Foto — AVIPET</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
  .logo { font-size: 13px; font-weight: 900; color: #1d4ed8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  h1 { font-size: 18px; font-weight: 900; color: #1e293b; margin-bottom: 4px; }
  .sub { font-size: 11px; color: #94a3b8; margin-bottom: 20px; }
  .info { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; text-align: left; }
  .info p { font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
  .info span { font-size: 13px; font-weight: 900; color: #1e293b; }
  .preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; display: none; border: 2px solid #e2e8f0; }
  label.btn-foto { display: block; width: 100%; padding: 14px; background: #1d4ed8; color: #fff; font-size: 13px; font-weight: 900; border-radius: 12px; cursor: pointer; margin-bottom: 10px; }
  label.btn-foto:active { background: #1e40af; }
  input[type=file] { display: none; }
  button.btn-subir { display: none; width: 100%; padding: 14px; background: #16a34a; color: #fff; font-size: 13px; font-weight: 900; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 10px; }
  button.btn-subir:active { background: #15803d; }
  .msg { font-size: 12px; font-weight: 700; padding: 10px; border-radius: 10px; margin-top: 8px; display: none; }
  .msg.ok  { background: #f0fdf4; color: #16a34a; }
  .msg.err { background: #fef2f2; color: #dc2626; }
  .spinner { display: none; margin: 12px auto; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #1d4ed8; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐾 AVIPET</div>
  <h1>Foto de Factura</h1>
  <p class="sub">Sube la foto del comprobante del proveedor</p>

  <div class="info" id="infoBox">
    <p>Proveedor / Documento</p>
    <span id="infoTxt">Cargando...</span>
  </div>

  <img id="preview" class="preview" alt="Vista previa">

  <label class="btn-foto" for="fileInput">📷 Tomar / Seleccionar foto</label>
  <input type="file" id="fileInput" accept="image/*" capture="environment">

  <button class="btn-subir" id="btnSubir">✅ Subir foto</button>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
  import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBd7HDH1wDbkq8T1XTsKUV0gBQ_O_BF7jI",
    authDomain: "avicolapet.firebaseapp.com",
    projectId: "avicolapet",
    storageBucket: "avicolapet.firebasestorage.app",
    messagingSenderId: "909478828234",
    appId: "1:909478828234:web:b04a444b41d239cc4a3c33"
  };

  const app     = initializeApp(firebaseConfig);
  const db      = getFirestore(app);
  const storage = getStorage(app);

  const params  = new URLSearchParams(location.search);
  const colName = params.get('col') || '';
  const docId   = params.get('id')  || '';

  const infoTxt  = document.getElementById('infoTxt');
  const preview  = document.getElementById('preview');
  const fileInput= document.getElementById('fileInput');
  const btnSubir = document.getElementById('btnSubir');
  const spinner  = document.getElementById('spinner');
  const msg      = document.getElementById('msg');

  // Cargar datos del documento para mostrar info
  if (colName && docId) {
    try {
      const snap = await getDoc(doc(db, colName, docId));
      if (snap.exists()) {
        const d = snap.data();
        infoTxt.textContent = (d.nombreProveedor || d.proveedor || '—') + (d.nroFactura ? ' · Fact. #' + d.nroFactura : '');
        if (d.fotoURL) {
          showMsg('Este documento ya tiene una foto. Puedes reemplazarla.', 'ok');
        }
      } else {
        infoTxt.textContent = 'Documento no encontrado';
      }
    } catch(e) {
      infoTxt.textContent = 'Error al cargar';
    }
  } else {
    infoTxt.textContent = 'Parámetros inválidos';
  }

  let selectedFile = null;

  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0];
    if (!selectedFile) return;
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
    btnSubir.style.display = 'block';
    hideMsg();
  });

  btnSubir.addEventListener('click', async () => {
    if (!selectedFile || !colName || !docId) return;
    if (selectedFile.size > 10 * 1024 * 1024) {
      showMsg('La imagen es muy grande. Máximo 10MB.', 'err');
      return;
    }
    btnSubir.style.display = 'none';
    spinner.style.display  = 'block';
    try {
      const ext     = selectedFile.name.split('.').pop() || 'jpg';
      const storRef = ref(storage, `facturas_proveedores/${colName}/${docId}.${ext}`);
      await uploadBytes(storRef, selectedFile);
      const url = await getDownloadURL(storRef);
      await updateDoc(doc(db, colName, docId), { fotoURL: url });
      spinner.style.display = 'none';
      preview.style.display = 'none';
      showMsg('✅ Foto guardada correctamente. Puedes cerrar esta página.', 'ok');
    } catch(e) {
      spinner.style.display = 'none';
      btnSubir.style.display = 'block';
      showMsg('Error: ' + e.message, 'err');
    }
  });

  function showMsg(txt, type) {
    msg.textContent = txt;
    msg.className   = 'msg ' + type;
    msg.style.display = 'block';
  }
  function hideMsg() {
    msg.style.display = 'none';
  }
</script>
</body>
</html>
